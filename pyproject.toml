[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "after-sales-agent"
version = "0.1.0"
description = "可审计的售后 LangGraph Agent"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.lock"]}

[tool.setuptools]
py-modules = ["mock_server"]

[tool.setuptools.packages.find]
include = ["agent*", "api*", "database*", "knowledge*", "dev*", "eval*", "mock", "mock_service*"]

[tool.setuptools.package-data]
database = ["*.sql", "dictionary.json", "ecommerce.db"]
knowledge = ["*.md"]
eval = ["golden_dataset.jsonl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
